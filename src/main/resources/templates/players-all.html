<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <h1>Игроки</h1>
    <div th:if="${successMessage}" th:text="${successMessage}" role="status"></div>
    <div class="grid" th:if="${!#lists.isEmpty(players)}">
        <article class="card" th:each="player : ${players}">
            <h2 th:text="${player.username}">Имя игрока</h2>
            <p><strong>Турнир:</strong> <span th:text="${player.tournamentTitle}">0</span></p>
            <p><strong>Рейтинг:</strong> <span th:text="${player.rating}">0</span></p>
            <p th:if="${player.seed != null}"><strong>Посев:</strong> <span th:text="${player.seed}">1</span></p>
        </article>
    </div>
    <p th:if="${#lists.isEmpty(players)}">Игроки пока не добавлены.</p>
    <a th:href="@{/players/add}">Добавить игрока</a>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
