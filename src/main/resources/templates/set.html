<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <article class="card">
        <h1 th:text="${set.title}">
            Название набора
        </h1>
        <p th:text="${set.description}">
            Описание набора
        </p>
    </article>
    <div class="grid" th:if="${!#lists.isEmpty(set.cards)}">
        <article class="card" th:each="card : ${set.cards}">
            <p>
                <strong>Вопрос:</strong>
                <span th:text="${card.term}">
                    Вопрос
                </span>
            </p>
            <p>
                <strong>Ответ:</strong>
                <span th:text="${card.definition}">
                    Ответ
                </span>
            </p>
        </article>
    </div>
    <p th:if="${#lists.isEmpty(set.cards)}">
        В этом наборе пока нет карточек.
    </p>
    <a th:href="@{/sets}">
        Вернуться к списку наборов
    </a>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
