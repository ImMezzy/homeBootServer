<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>

<header th:replace="~{fragments/navbar}"></header>

<main id="main-content" class="container">
    <h1>Наборы карточек</h1>
    <p>Выберите набор для изучения</p>
    <div class="grid" th:if="${!#lists.isEmpty(setsInfos)}">
        <article class="card" th:each="set : ${setsInfos}">
            <h2 th:text="${set.title}">
                Название набора
            </h2>
            <p>
                <strong>Описание:</strong>
                <span th:text="${set.description}">
                    Описание набора
                </span>
            </p>
            <p>
                <strong>Количество карточек:</strong>
                <span th:text="${#lists.size(set.cards)}">
                    0
                </span>
            </p>
            <a th:href="@{/sets/{setId}(setId=${set.id})}">
                Открыть набор
            </a>
        </article>

    </div>
    <p th:if="${#lists.isEmpty(setsInfos)}">
        Наборы карточек пока не добавлены.
    </p>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
