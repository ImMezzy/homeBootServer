<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <h1 th:text="${formHeading}">Новый турнир</h1>
    <form class="stack" th:action="${editing and originalTitle != null}
      ? @{/tournaments/{title}(title=${originalTitle})}
      : @{/tournaments}" method="post"
          th:object="${tournamentModel}" novalidate>
        <div role="alert" th:if="${#fields.hasAnyErrors()}">Исправьте отмеченные поля.</div>
        <div role="alert" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Ошибка сохранения</div>

        <label for="title">Название
            <input id="title" type="text" th:field="*{title}" maxlength="100"
                   th:attr="aria-invalid=${#fields.hasErrors('title')}">
            <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Ошибка названия</span>
        </label>
        <label for="description">Описание
            <textarea id="description" rows="4" maxlength="2000" th:field="*{description}"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Ошибка описания</span>
        </label>
        <label for="maxPlayers">Максимальное количество участников
            <input id="maxPlayers" type="number" min="2" max="64" th:field="*{maxPlayers}">
            <span th:if="${#fields.hasErrors('maxPlayers')}" th:errors="*{maxPlayers}">Ошибка количества участников</span>
        </label>
        <label for="prizeFund">Призовой фонд
            <input id="prizeFund" type="number" min="1000" max="100000000" step="0.01" th:field="*{prizeFund}">
            <span th:if="${#fields.hasErrors('prizeFund')}" th:errors="*{prizeFund}">Ошибка призового фонда</span>
        </label>
        <label for="startsAt">Дата и время начала (UTC)
            <input id="startsAt" type="datetime-local" step="1" th:field="*{startsAt}">
            <span th:if="${#fields.hasErrors('startsAt')}" th:errors="*{startsAt}">Ошибка даты и времени</span>
        </label>
        <button type="submit" th:text="${submitLabel}">Создать турнир</button>
    </form>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
