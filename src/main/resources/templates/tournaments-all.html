<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>

<header th:replace="~{fragments/navbar}"></header>

<main id="main-content" class="container">
    <h1>Киберспортивные турниры</h1>
    <p>Выберите турнир и посмотрите подробную информацию</p>
    <div class="grid" th:if="${!#lists.isEmpty(tournamentInfos)}">
        <article class="card" th:each="tournament : ${tournamentInfos}">
            <h2 th:text="${tournament.title}">
                Название турнира
            </h2>
            <p>
                <strong>Максимум участников:</strong>
                <span th:text="${tournament.maxPlayers}">
                    0
                </span>
            </p>
            <p>
                <strong>Количество участников</strong>
                <span th:text="${tournament.playerCount}"></span>
            </p>
            <p>
                <strong>Призовой фонд:</strong>
                <span th:text="|${tournament.prizeFund} ₽|">
                    0 ₽
                </span>
            </p>
            <p>
                <strong>Статус:</strong>
                <span th:text="${tournament.status != null ? tournament.status.status : 'Не указан'}">
                    Статус регистрации
                </span>
            </p>
            <a th:href="@{/tournaments/{title}(title=${tournament.title})}">
                Подробнее
            </a>
        </article>
    </div>

    <a th:href="@{/tournaments/add}">
        Создать турнир
    </a>

    <p th:if="${#lists.isEmpty(tournamentInfos)}">
        Турниры пока не добавлены.
    </p>

    <div th:if="${successMessage}"
         th:text="${successMessage}"
         role="status">
    </div>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
